name: Backend CI/CD

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Migración previa - Add backup_state y stock (base existente, idempotente)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute lola-db --remote --command \
            "ALTER TABLE metadata ADD COLUMN backup_state TEXT NOT NULL DEFAULT '{\"newest\":\"bak2\"}'" \
            || echo "Columna backup_state ya existe — OK"
          npx wrangler d1 execute lola-db --remote --command \
            "ALTER TABLE products ADD COLUMN stock REAL NOT NULL DEFAULT 0" \
            || echo "Columna stock en products ya existe — OK"
          npx wrangler d1 execute lola-db --remote --command \
            "ALTER TABLE products_bak ADD COLUMN stock REAL NOT NULL DEFAULT 0" \
            || echo "Columna stock en products_bak ya existe — OK"
          npx wrangler d1 execute lola-db --remote --command \
            "ALTER TABLE products_bak2 ADD COLUMN stock REAL NOT NULL DEFAULT 0" \
            || echo "Columna stock en products_bak2 ya existe — OK"

      - name: Schema D1 (idempotente)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute lola-db --remote --file=./schema.sql

      - name: Migraciones D1 (idempotentes)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute lola-db --remote --file=./scripts/migrate.sql

      - name: Deploy Worker (secrets opcionales)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_USER: ${{ secrets.ADMIN_USER }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          npx wrangler deploy
          if [ -n "$ADMIN_USER" ]; then echo "$ADMIN_USER" | npx wrangler secret put ADMIN_USER; fi
          if [ -n "$ADMIN_PASSWORD" ]; then echo "$ADMIN_PASSWORD" | npx wrangler secret put ADMIN_PASSWORD; fi
          if [ -n "$JWT_SECRET" ]; then echo "$JWT_SECRET" | npx wrangler secret put JWT_SECRET; fi
